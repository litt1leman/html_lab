<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Статистика пород котиков — сортировка и фильтрация</title>
  <link rel="stylesheet" href="style5.css">
</head>
<body>
<div class="container">
  <h1>Мир котиков</h1>
  <ul class="nav">
    <li><a href="index.html">Главная</a></li>
    <li><a href="cat-details.html">О породах</a></li>
    <li><a href="data.html">Статистика</a></li>
  </ul>
</div>

<div class="filter-section">
  <h3>Фильтрация таблицы</h3>
  <div class="filter-controls">
    <div class="filter-group">
      <label>Вес (кг):</label><br>
      <input type="number" id="minWeight" value="1" min="1" max="10" step="0.5" class="filter-input"> 
      - 
      <input type="number" id="maxWeight" value="10" min="1" max="10" step="0.5" class="filter-input">
    </div>
    <div class="filter-group"></div>
  <label>Поиск по породе:</label><br>
  <input type="text" id="searchText" placeholder="Введите название породы..." style="padding:6px;width:200px;">
</div>
    <div class="filter-group filter-buttons">
      <button id="applyFilterBtn" class="btn btn-primary">Применить фильтры</button>
      <button id="resetFilterBtn" class="btn btn-secondary">Сбросить фильтры</button>
    </div>
  </div>
</div>

<!-- Блок сортировки -->
<div class="sort-section">
  <h3>Сортировка таблицы</h3>
  <div id="sortLevelsContainer">
    <!-- Уровни сортировки будут добавлены через JS -->
  </div>
  <div class="sort-actions">
    <button id="applySortBtn" class="btn btn-success">Применить сортировку</button>
    <button id="resetSortBtn" class="btn btn-danger">Сбросить сортировку</button>
  </div>
</div>

<!-- Таблица -->
<div class="table-section">
  <h2>Статистика пород</h2>
  <div id="recordsCount" class="records-count">Показано записей: 50 из 50</div>
  <table class="cat-table" id="catTable">
    <thead>
      <tr>
        <th>№</th>
        <th>Порода</th>
        <th>Популярность</th>
        <th>Вес (кг)</th>
        <th>Возраст (лет)</th>
        <th>Активность</th>
      </tr>
    </thead>
    <tbody id="tableBody">
    </tbody>
  </table>
</div>

<div class="footer">
  <p>Группа: Б9123-02.03.03тп | Косенко Е.О.</p>
</div>

<script src="script5.js"></script>
</body>
</html>
